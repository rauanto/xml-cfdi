[package]
name = "cfdi-zip-processor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
chrono = "0.4.45"
directories = "6.0.0"
gpui = { version = "=1.14.2", package = "gpui-unofficial" }
gpui_platform = { version = "=1.14.2", package = "gpui-platform-gpui-unofficial", features = ["font-kit"] }
gpuikit = "=0.9.0"
quick-xml = "0.42.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8.20"
rust_decimal = "1.43.0"
rust_xlsxwriter = { version = "0.102.0", features = ["rust_decimal"] }
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
zip = "9.2.2"

[dev-dependencies]
calamine = "0.38.0"
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
